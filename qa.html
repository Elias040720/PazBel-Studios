<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PazBel — Control de calidad local</title><style>body{margin:0;background:#232630;color:#eee;font:13px system-ui}header{padding:12px;position:sticky;top:0;z-index:10;background:#20232d;display:flex;gap:10px;flex-wrap:wrap}button,select{padding:8px;background:#eee;border:0;border-radius:3px}pre{padding:15px;white-space:pre-wrap;font-size:11px}#stage{overflow:hidden}iframe{border:0;background:#0b0d13;transform-origin:top left}label{display:flex;align-items:center;gap:5px}</style><header><button id="run">Ejecutar pruebas</button><label>Ancho <select id="width"><option>375</option><option>430</option><option>768</option><option>1024</option><option selected>1440</option><option>1920</option></select></label><label>Sección <select id="section"><option value="inicio">Inicio</option><option value="experiencia">Experiencia</option><option value="servicios">Servicios</option><option value="proyectos">Proyectos</option><option value="demo">Demo</option><option value="precios">Precios</option><option value="cotizador">Cotizador</option><option value="contacto">Contacto</option></select></label><button id="view">Ver</button></header><pre id="results">Pruebas pendientes.</pre><div id="stage"><iframe id="site" title="Vista adaptable de PazBel"></iframe></div><script>
const frame=document.querySelector('#site'),output=document.querySelector('#results');const errors=[];const results=[];let source;
function size(width){frame.style.width=width+'px';frame.style.height='1000px';const scale=Math.min(1,(innerWidth-2)/width);frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=(1000*scale)+'px';}
async function load(width,mode='normal'){size(width);source ||= await (await fetch('index.html')).text();let html=source.replace('<head>','<head><base href="'+location.origin+'/">');if(mode==='reduced'){const css=await (await fetch('css/styles.css')).text();html=html.replace('<link rel="stylesheet" href="css/styles.css">','<style>'+css.replace('@media(prefers-reduced-motion:reduce)','@media all')+'</style>');html=html.replace('<head>','<head><script>const nativeMatch=window.matchMedia.bind(window);window.matchMedia=q=>{if(q.includes("prefers-reduced-motion")){const m=nativeMatch(q);Object.defineProperty(m,"matches",{value:q.includes("no-preference")?false:true});return m;}return nativeMatch(q);};<\/script>');}if(mode==='no-libraries')html=html.replace(/<script defer src="assets\/vendor\/[^\"]+"><\/script>/g,'');html=html.replace('<head>','<head><script>window.addEventListener("error",e=>parent.postMessage({qaError:e.message},location.origin));<\/script>');await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html});await new Promise(r=>setTimeout(r,1400));return frame.contentWindow;}
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data.qaError)errors.push(e.data.qaError)});
function check(name,condition,extra=''){results.push({name,pass:!!condition,extra:condition?'':extra});output.textContent=results.map(x=>(x.pass?'PASS ':'FAIL ')+x.name+(x.extra?' — '+x.extra:'')).join('\n');}
async function test(width,mode='normal'){
const w=await load(width,mode);await w.document.fonts.ready;w.ScrollTrigger?.refresh();const d=w.document,q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];
check(width+' '+mode+': sin desbordamiento',d.documentElement.scrollWidth<=width,'scrollWidth='+d.documentElement.scrollWidth);
const overflow=qa('h1,h2,h3,.button,.radio-option,.plan,.project-info,.quote-summary').filter(el=>{const r=el.getBoundingClientRect();return r.right>width+1||r.left< -1;}).map(e=>e.tagName+'.'+e.className);
check(width+': contenido dentro del ancho',overflow.length===0,overflow.join(', '));
check(width+': planes, proyectos y FAQ',qa('.plan').length===4&&qa('.subscription').length===3&&qa('.project').length===3&&qa('details').length===8);
check(width+': anclas válidas',qa('a[href^="#"]').every(a=>q(a.getAttribute('href'))));
let combinations=true,messages=true;
for(const p of w.PAZBEL.plans)for(const s of w.PAZBEL.subscriptions){q(`input[value="${p.id}"]`).click();q(`input[value="${s.id}"]`).click();const amounts=qa('.quote-amount strong');combinations&&=amounts[0].textContent.includes(w.PazbelApp.money(p.price))&&amounts[1].textContent.includes(w.PazbelApp.money(s.price));q('#quote-contact').click();const msg=q('#contact-message').value;messages&&=msg.includes(p.name)&&(s.price?msg.includes(s.name):msg.includes('sin suscripción'));if(p.from)messages&&=msg.includes('referencial');q('#contact-dialog').close();}
check(width+': 16 combinaciones de presupuesto',combinations);check(width+': 16 mensajes contextuales',messages);
let demos=true;for(const id of ['restaurante','taller','moda','profesional']){q(`[data-industry="${id}"]`).click();demos&&=q('#industry-preview').dataset.theme===id&&q(`[data-industry="${id}"]`).getAttribute('aria-pressed')==='true';q('#demo-contact').click();demos&&=q('#contact-message').value.includes(q(`[data-industry="${id}"]`).textContent);q('#contact-dialog').close();}check(width+': cuatro rubros y sus mensajes',demos);
check(width+': número ausente no genera enlace',w.PazbelApp.whatsappUrl('Prueba')===null);
const saved=w.PAZBEL.whatsapp;w.PAZBEL.whatsapp='51900000000';const encoded=w.PazbelApp.whatsappUrl('Cotización: S/ 499 + Tracción & Perú');check(width+': codificación WhatsApp',new URL(encoded).searchParams.get('text')==='Cotización: S/ 499 + Tracción & Perú');w.PAZBEL.whatsapp=saved;
if(width<=800){q('.menu-toggle').click();check(width+': menú abre',q('.menu-toggle').getAttribute('aria-expanded')==='true');q('#navigation a[href="#precios"]').click();check(width+': menú cierra al navegar',q('.menu-toggle').getAttribute('aria-expanded')==='false');}
q('summary').click();check(width+': FAQ abre',q('details').open);q('summary').click();
if(mode==='normal'&&width>800){check(width+': ScrollTrigger activo',w.ScrollTrigger.getAll().length>=6);q('.chapter[data-stage="2"]').scrollIntoView({behavior:'instant',block:'center'});await new Promise(r=>setTimeout(r,800));check(width+': capítulo 3 ligado al scroll',q('.story-visual').dataset.stage==='2');}
if(mode==='reduced'){check(width+': movimiento reducido sin ScrollTriggers',w.ScrollTrigger.getAll().length===0);check(width+': movimiento reducido sin sticky ni scroll suave',w.getComputedStyle(q('.story-visual')).position==='relative'&&w.getComputedStyle(d.documentElement).scrollBehavior==='auto');}if(mode==='no-libraries')check(width+': fallback sin GSAP',!w.gsap&&q('h1').getBoundingClientRect().height>0);
}
document.querySelector('#run').onclick=async()=>{results.length=0;errors.length=0;document.querySelector('#run').disabled=true;try{for(const width of [375,430,768,1024,1440,1920])await test(width);await test(1440,'no-libraries');await test(1440,'reduced');check('Sin errores JavaScript durante la prueba',errors.length===0,errors.join('; '));output.textContent+='\nRESULTADO: '+results.filter(x=>x.pass).length+'/'+results.length+' verificaciones correctas.';window.qaResults=results;}catch(e){output.textContent+='\nERROR: '+e.stack;}finally{document.querySelector('#run').disabled=false}};
document.querySelector('#view').onclick=async()=>{await load(Number(document.querySelector('#width').value));frame.contentDocument.querySelector('#'+document.querySelector('#section').value).scrollIntoView({behavior:'instant'});window.scrollTo(0,0);output.textContent='Vista: '+document.querySelector('#width').value+' px / '+document.querySelector('#section').value;};
load(1440);
</script></html>
